<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Altiora Lora"; src: url("../../web/src/styles/lora-var.woff") format("woff"); font-weight: 400 700; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: #070708; overflow: hidden; }
  .card {
    position: relative; width: 1200px; height: 630px; padding: 64px 72px; color: #fbfaf7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(900px 520px at 88% 8%, rgba(201,162,75,.20), rgba(201,162,75,0) 60%),
      radial-gradient(700px 500px at 0% 110%, rgba(201,162,75,.08), rgba(201,162,75,0) 60%),
      linear-gradient(160deg, #0d0d0f 0%, #070708 70%);
  }
  .brand { display: flex; align-items: center; gap: 18px; }
  .mark { width: 56px; height: 56px; }
  .name { font-size: 22px; letter-spacing: .32em; text-transform: uppercase; color: #e4e3df; }
  .name b { color: #d9b865; font-weight: 600; }
  .eyebrow { margin-top: 96px; font-size: 17px; letter-spacing: .34em; text-transform: uppercase; color: #c9a24b; }
  h1 { margin-top: 22px; width: 650px; font-family: "Altiora Lora", Georgia, serif; font-weight: 500; font-size: 62px; line-height: 1.12; letter-spacing: -.01em; }
  h1 span { color: #d9b865; }
  .foot { position: absolute; left: 72px; bottom: 56px; display: flex; gap: 14px; align-items: center; font-size: 19px; color: #9a9aa3; }
  .foot i { width: 36px; height: 1px; background: #c9a24b; display: block; }
  /* o prato visto de cima, com anéis de rotação 3D: desenho geométrico, não é uma fotografia nem uma captura do produto */
  .art { position: absolute; right: 40px; top: 92px; width: 440px; height: 440px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#131316" stroke="#3a3a41"/><path d="M19 48 32 15 45 48M24.5 37h15" fill="none" stroke="#c9a24b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="name">Altiora <b>Menu</b></span>
  </div>
  <p class="eyebrow">Digital Dining Experience</p>
  <h1>O cardápio do seu restaurante, num QR&nbsp;Code e <span>em&nbsp;3D</span>.</h1>
  <p class="foot"><i></i>Altiora Grupo</p>
  <svg class="art" viewBox="0 0 440 440" aria-hidden="true">
    <defs>
      <radialGradient id="plate" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#2a2a30"/><stop offset="1" stop-color="#131316"/></radialGradient>
      <radialGradient id="food" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#e8cf8f"/><stop offset="1" stop-color="#9c7a2e"/></radialGradient>
      <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8cf8f"/><stop offset="1" stop-color="#c9a24b" stop-opacity=".25"/></linearGradient>
    </defs>
    <circle cx="220" cy="220" r="196" fill="url(#plate)" stroke="#3a3a41" stroke-width="2"/>
    <circle cx="220" cy="220" r="150" fill="none" stroke="#26262b" stroke-width="2"/>
    <circle cx="220" cy="220" r="108" fill="url(#food)" opacity=".92"/>
    <circle cx="190" cy="190" r="26" fill="#fbfaf7" opacity=".14"/>
    <ellipse cx="220" cy="220" rx="214" ry="62" fill="none" stroke="url(#ring)" stroke-width="2.5" transform="rotate(-24 220 220)"/>
    <ellipse cx="220" cy="220" rx="214" ry="62" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity=".5" transform="rotate(48 220 220)"/>
    <circle cx="403" cy="112" r="7" fill="#d9b865"/>
    <circle cx="48" cy="300" r="5" fill="#d9b865" opacity=".7"/>
  </svg>
</div>
</body>
</html>
