<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<script type="module">
// Pratos de demonstração do restaurante fictício «Casa Aurora».
// São ILUSTRAÇÕES 3D geradas por computador (formas simples com iluminação), NÃO fotografias. Servem para mostrar como o
// cardápio fica com imagens e modelos 3D; um restaurante a sério deve usar fotografias próprias.
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const TAU = Math.PI * 2;
const Y = 0.05; // altura do fundo do prato

// ---------------------------------------------------------------- aleatório e ruído (tudo determinístico)
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash3(x, y, z, s) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 2147483647) ^ Math.imul(s | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y, z, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const L = (a, b, t) => a + (b - a) * t;
  return L(
    L(L(hash3(xi, yi, zi, s), hash3(xi + 1, yi, zi, s), u), L(hash3(xi, yi + 1, zi, s), hash3(xi + 1, yi + 1, zi, s), u), v),
    L(L(hash3(xi, yi, zi + 1, s), hash3(xi + 1, yi, zi + 1, s), u), L(hash3(xi, yi + 1, zi + 1, s), hash3(xi + 1, yi + 1, zi + 1, s), u), v),
    w,
  );
}
function fbm(x, y, z, s = 0) {
  let a = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 3; i++) { a += amp * vnoise(x * f, y * f, z * f, s + i * 17); amp *= 0.5; f *= 2.03; }
  return a;
}
const clamp01 = (v) => Math.min(1, Math.max(0, v));

// ---------------------------------------------------------------- materiais
const M = (color, rough = 0.6, metal = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });
const vcMat = (rough = 0.6, metal = 0, extra = {}) => new THREE.MeshStandardMaterial({ vertexColors: true, roughness: rough, metalness: metal, ...extra });
const glassMat = () => new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.04, metalness: 0, transparent: true, opacity: 0.2, depthWrite: false, side: THREE.DoubleSide });

// ---------------------------------------------------------------- formas
/** Esfera deformada com ruído e cor variada: a base de tudo o que é orgânico (carne, arroz, massa, folhas…). */
function blob(o) {
  const { rx = 1, ry = 1, rz = 1, seg = [28, 18], bump = 0.06, freq = 2.4, color = 0xffffff, color2 = color, variance = 0.2, seed = 1, rough = 0.6, metal = 0, flat = 0, warp = null, tint = null } = o;
  let g = new THREE.SphereGeometry(1, seg[0], seg[1]);
  g.deleteAttribute('uv'); g.deleteAttribute('normal');
  g = mergeVertices(g, 1e-5);
  const p = g.attributes.position, n = p.count, col = new Float32Array(n * 3);
  const a = new THREE.Color(color), b = new THREE.Color(color2), t = new THREE.Color();
  for (let i = 0; i < n; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const d = 1 + (fbm(x * freq + seed * 3.1, y * freq + seed * 1.7, z * freq - seed * 2.3, seed) - 0.43) * bump * 2.4;
    x *= d; y *= d; z *= d;
    if (flat > 0 && y < 0) y *= 1 - flat;
    if (warp) [x, y, z] = warp(x, y, z);
    const mix = clamp01((fbm(x * 2.8, y * 2.8, z * 2.8, seed + 11) - 0.2) * 1.6);
    t.copy(a).lerp(b, mix);
    const v = 1 + (vnoise(x * 7 + seed, y * 7, z * 7, seed + 5) - 0.5) * variance;
    t.multiplyScalar(v);
    if (tint) tint(x, y, z, t);
    col[i * 3] = t.r; col[i * 3 + 1] = t.g; col[i * 3 + 2] = t.b;
    p.setXYZ(i, x * rx, y * ry, z * rz);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  return new THREE.Mesh(g, vcMat(rough, metal));
}

/** Caixa de cantos arredondados (cubos de manga, batatas, mandioca…). */
function roundedBox(w, h, d, r = 0.02, s = 4) {
  let g = new THREE.BoxGeometry(1, 1, 1, s, s, s);
  g.deleteAttribute('uv'); g.deleteAttribute('normal');
  g = mergeVertices(g, 1e-5);
  const p = g.attributes.position, v = new THREE.Vector3(), inner = new THREE.Vector3(), half = new THREE.Vector3(w / 2 - r, h / 2 - r, d / 2 - r);
  for (let i = 0; i < p.count; i++) {
    v.set(p.getX(i) * w, p.getY(i) * h, p.getZ(i) * d);
    inner.set(Math.max(-half.x, Math.min(half.x, v.x)), Math.max(-half.y, Math.min(half.y, v.y)), Math.max(-half.z, Math.min(half.z, v.z)));
    const dir = v.clone().sub(inner);
    if (dir.lengthSq() > 0) v.copy(inner).add(dir.normalize().multiplyScalar(r));
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}

/** Junta muitas peças pequenas numa só malha, cada uma com a sua cor. */
function mergeColored(parts, mat) {
  const geos = parts.map((q) => {
    let g = q.geo.clone();
    g.deleteAttribute('uv');
    const m = new THREE.Matrix4().compose(new THREE.Vector3(...q.pos), new THREE.Quaternion().setFromEuler(new THREE.Euler(...(q.rot ?? [0, 0, 0]))), new THREE.Vector3(...(q.scale ?? [1, 1, 1])));
    g.applyMatrix4(m);
    const c = new THREE.Color(q.color), n = g.attributes.position.count, arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    return g;
  });
  return new THREE.Mesh(mergeGeometries(geos), mat ?? vcMat(0.6));
}

function lathe(points, { seg = 72, color = 0xffffff, rough = 0.4, metal = 0, mat = null } = {}) {
  return new THREE.Mesh(new THREE.LatheGeometry(points.map(([x, y]) => new THREE.Vector2(x, y)), seg), mat ?? M(color, rough, metal));
}

const sphere = (r, ws = 10, hs = 8) => new THREE.SphereGeometry(r, ws, hs);
const at = (obj, x, y, z, ry = 0) => { obj.position.set(x, y, z); obj.rotation.y = ry; return obj; };

// ---------------------------------------------------------------- loiça
const WHITE = 0xe8e4d9, SLATE = 0x2a2a2f;
function plate({ color = WHITE, rim = false, r = 1 } = {}) {
  const g = new THREE.Group();
  const pts = [[0, 0], [0.62, 0], [0.7, 0.02], [0.98, 0.1], [1.02, 0.13], [1.0, 0.145], [0.94, 0.12], [0.7, 0.05], [0, 0.045]].map(([x, y]) => [x * r, y * r]);
  g.add(lathe(pts, { seg: 96, color, rough: color === WHITE ? 0.22 : 0.36 }));
  if (rim) {
    const t = new THREE.Mesh(new THREE.TorusGeometry(0.962 * r, 0.011 * r, 8, 96), M(0xc9a24b, 0.28, 0.9));
    t.rotation.x = Math.PI / 2; t.position.y = 0.1315 * r; g.add(t);
  }
  return g;
}

function glassTumbler({ h = 0.9, rb = 0.34, rt = 0.4, liquid = 0xf0a82a, fill = 0.78, rough = 0.18 } = {}) {
  const g = new THREE.Group();
  const wall = 0.025, base = 0.07;
  g.add(lathe([[0, 0], [rb, 0], [rb + 0.01, 0.02], [rt, h], [rt - wall, h], [rb - wall + 0.005, base + 0.01], [0, base]], { seg: 64, mat: glassMat() }));
  const top = base + (h - base) * fill;
  const rtop = rb - wall + (rt - rb) * ((top - base) / (h - base));
  g.add(lathe([[0, base + 0.005], [rb - wall - 0.004, base + 0.005], [rtop - 0.004, top], [0, top]], { seg: 64, color: liquid, rough }));
  return { group: g, top, rtop };
}

function lemon() {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0); shape.absarc(0, 0, 0.13, -0.55, 0.55, false); shape.lineTo(0, 0);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.045, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 2, curveSegments: 14 });
  geo.deleteAttribute('uv');
  const m = new THREE.Mesh(geo, [M(0xf4e08a, 0.35), M(0xf0c823, 0.4)]);
  m.rotation.x = -Math.PI / 2;
  const g = new THREE.Group(); g.add(m); return g;
}

function herbs(g, rng, n, cx, cz, R, y = Y + 0.02, size = 0.028) {
  const parts = [], tones = [0x4f8a2f, 0x3b6f22, 0x62a03a];
  for (let i = 0; i < n * 2; i++) {
    const a = rng() * TAU, d = Math.sqrt(rng()) * R, s = 0.6 + rng() * 0.7;
    parts.push({ geo: sphere(size, 12, 8), pos: [cx + Math.cos(a) * d, y + rng() * 0.03, cz + Math.sin(a) * d], rot: [rng() * 0.6, rng() * TAU, rng() * 0.6], scale: [(1.2 + rng() * 1.1) * s, 0.26, (0.65 + rng() * 0.5) * s], color: tones[i % 3] });
  }
  g.add(mergeColored(parts, vcMat(0.6)));
}

function fishBody({ len = 0.85, base = 0xb9b9b2, belly = 0xe6dfcf, stripe = 0x2b231d, seed = 1, h = 0.15, w = 0.27 }) {
  const grp = new THREE.Group();
  const body = blob({
    rx: len / 2, ry: h, rz: w, seg: [44, 26], bump: 0.03, freq: 2, color: base, color2: 0xa39a84, variance: 0.18, seed, rough: 0.4,
    warp: (x, y, z) => { const u = (x + 1) / 2, k = Math.pow(Math.sin(Math.PI * (0.06 + 0.9 * u)), 0.6); return [x, y * (0.55 + 0.45 * k), z * k]; },
    tint: (x, y, z, c) => {
      if (y < -0.25) c.lerp(new THREE.Color(belly), 0.85);
      else if (y > 0.1 && Math.sin(x * 16 + z * 2.2) > 0.72) c.lerp(new THREE.Color(stripe), 0.9);
    },
  });
  grp.add(body);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.24, 3), M(0x8f866e, 0.5));
  tail.geometry.deleteAttribute('uv'); tail.scale.set(1, 1, 0.22); tail.rotation.z = -Math.PI / 2; tail.position.set(-len / 2 - 0.1, 0, 0); grp.add(tail);
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(sphere(0.032, 12, 10), M(0xf4f1e8, 0.3));
    eye.position.set(len / 2 - 0.12, h * 0.25, s * w * 0.55); grp.add(eye);
    const pupil = new THREE.Mesh(sphere(0.018, 10, 8), M(0x0a0a0a, 0.2));
    pupil.position.set(len / 2 - 0.095, h * 0.25, s * w * 0.6); grp.add(pupil);
  }
  return grp;
}

function shrimp(seed, scale = 1) {
  const rng = mulberry32(seed), grp = new THREE.Group();
  const pts = [];
  for (let i = 0; i < 9; i++) { const t = i / 8, a = -0.1 + t * Math.PI * 0.92; pts.push(new THREE.Vector3(Math.cos(a) * 0.25, 0.085 + Math.sin(t * Math.PI) * 0.07, Math.sin(a) * 0.25)); }
  const curve = new THREE.CatmullRomCurve3(pts);
  const T = 40, R = 14;
  let geo = new THREE.TubeGeometry(curve, T, 0.092, R, false);
  geo.deleteAttribute('uv');
  const p = geo.attributes.position, col = new Float32Array(p.count * 3);
  const head = new THREE.Color(0xf0875a), tailC = new THREE.Color(0xd9552c), dark = new THREE.Color(0xa63b1c), belly = new THREE.Color(0xf6c9a4), c = new THREE.Color();
  for (let i = 0; i <= T; i++) {
    const t = i / T, centre = curve.getPointAt(t), taper = 1.18 - 0.78 * Math.pow(t, 0.85) + Math.sin(t * Math.PI) * 0.12;
    for (let j = 0; j <= R; j++) {
      const k = i * (R + 1) + j, v = new THREE.Vector3(p.getX(k), p.getY(k), p.getZ(k)).sub(centre).multiplyScalar(taper).add(centre);
      p.setXYZ(k, v.x, v.y, v.z);
      c.copy(head).lerp(tailC, t);
      const ang = (j / R) * TAU;
      if (Math.sin(t * 52) > 0.55) c.lerp(dark, 0.55);
      if (Math.cos(ang) < -0.55) c.lerp(belly, 0.6);
      col[k * 3] = c.r; col[k * 3 + 1] = c.g; col[k * 3 + 2] = c.b;
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  grp.add(new THREE.Mesh(geo, vcMat(0.38)));
  // cauda em leque: três lóbulos achatados
  const end = curve.getPointAt(1), tan = curve.getTangentAt(1), q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1, 0, 0), tan);
  for (let k = -1; k <= 1; k++) {
    const lobe = blob({ rx: 0.1, ry: 0.012, rz: 0.034, seg: [16, 8], bump: 0.02, color: 0xe2602f, color2: 0xc9431c, variance: 0.15, seed: 300 + k, rough: 0.4 });
    lobe.position.set(0.1, 0, 0);
    const pivot = new THREE.Group(); pivot.add(lobe); pivot.rotation.y = k * 0.5;
    const holder = new THREE.Group(); holder.add(pivot); holder.quaternion.copy(q); holder.position.copy(end); grp.add(holder);
  }
  // cabeça arredondada, olhos e antenas
  const start = curve.getPointAt(0), back = curve.getTangentAt(0).multiplyScalar(-1), up = new THREE.Vector3(0, 1, 0), side = up.clone().cross(back).normalize();
  const headCap = blob({ rx: 0.108, ry: 0.104, rz: 0.108, seg: [22, 16], bump: 0.02, color: 0xf0875a, color2: 0xe0663a, variance: 0.15, seed: 310, rough: 0.38 });
  headCap.position.copy(start); grp.add(headCap);
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(sphere(0.02, 10, 8), M(0x0a0a0a, 0.2));
    eye.position.copy(start).addScaledVector(back, 0.085).addScaledVector(side, 0.05 * s).addScaledVector(up, 0.04); grp.add(eye);
  }
  grp.scale.setScalar(scale);
  grp.rotation.y = rng() * 0.4;
  return grp;
}

// ---------------------------------------------------------------- os 12 pratos
function pasteis() {
  const g = new THREE.Group(), rng = mulberry32(11);
  g.add(plate({ r: 0.84 }));
  [[-0.3, 0.1, 0.25], [0.2, 0.2, -0.35], [-0.04, -0.3, 1.2]].forEach(([x, z, ry], i) => {
    const b = blob({ rx: 0.25, ry: 0.13, rz: 0.145, seg: [32, 20], bump: 0.1, freq: 3.2, color: 0xe0a24a, color2: 0xa6601a, variance: 0.35, seed: 20 + i, rough: 0.5, flat: 0.3 });
    g.add(at(b, x, Y + 0.11, z, ry));
  });
  g.add(at(lemon(), 0.4, Y, -0.28, 0.6));
  herbs(g, rng, 12, -0.05, -0.05, 0.5);
  return g;
}

function salada() {
  const g = new THREE.Group(), rng = mulberry32(5);
  g.add(plate({ r: 1 }));
  const greens = [0x3f7d24, 0x5a9a30, 0x2f6a1f];
  for (let i = 0; i < 10; i++) {
    const a = rng() * TAU, d = 0.08 + rng() * 0.45;
    const b = blob({ rx: 0.26 + rng() * 0.1, ry: 0.045, rz: 0.15 + rng() * 0.05, seg: [22, 12], bump: 0.22, freq: 3, color: greens[i % 3], color2: 0x8fc050, variance: 0.25, seed: 30 + i, rough: 0.5 });
    b.position.set(Math.cos(a) * d, Y + 0.05 + rng() * 0.12, Math.sin(a) * d); b.rotation.set((rng() - 0.5) * 0.5, rng() * TAU, (rng() - 0.5) * 0.5); g.add(b);
  }
  const mango = [];
  for (let i = 0; i < 12; i++) { const a = rng() * TAU, d = rng() * 0.5; mango.push({ geo: roundedBox(0.14, 0.11, 0.14, 0.03, 3), pos: [Math.cos(a) * d, Y + 0.2 + rng() * 0.07, Math.sin(a) * d], rot: [rng(), rng() * TAU, rng()], color: i % 2 ? 0xf08a12 : 0xf5a21b }); }
  g.add(mergeColored(mango, vcMat(0.32)));
  for (let i = 0; i < 6; i++) {
    const a = rng() * TAU, d = 0.1 + rng() * 0.4;
    const s = blob({ rx: 0.15, ry: 0.032, rz: 0.055, seg: [18, 10], bump: 0.05, color: 0xc4d97a, color2: 0x8fb04a, variance: 0.15, seed: 70 + i, rough: 0.4 });
    s.position.set(Math.cos(a) * d, Y + 0.2 + rng() * 0.08, Math.sin(a) * d); s.rotation.set(0, rng() * TAU, (rng() - 0.5) * 0.4); g.add(s);
  }
  for (let i = 0; i < 3; i++) {
    const a = rng() * TAU, d = rng() * 0.35;
    const t = new THREE.Mesh(new THREE.TorusGeometry(0.06 + rng() * 0.03, 0.009, 6, 20), M(0x8a2a6a, 0.4)); t.geometry.deleteAttribute('uv');
    t.position.set(Math.cos(a) * d, Y + 0.27, Math.sin(a) * d); t.rotation.set(Math.PI / 2 + (rng() - 0.5) * 0.4, 0, rng() * TAU); g.add(t);
  }
  const seeds = [];
  for (let i = 0; i < 30; i++) { const a = rng() * TAU, d = Math.sqrt(rng()) * 0.55; seeds.push({ geo: sphere(0.011, 6, 4), pos: [Math.cos(a) * d, Y + 0.3 + rng() * 0.05, Math.sin(a) * d], scale: [1.5, 0.8, 1], color: 0xf1e6c8 }); }
  g.add(mergeColored(seeds, vcMat(0.6)));
  return g;
}

function muamba() {
  const g = new THREE.Group(), rng = mulberry32(3);
  g.add(plate({ r: 1.05 }));
  g.add(at(blob({ rx: 0.3, ry: 0.2, rz: 0.3, seg: [32, 20], bump: 0.025, freq: 2, color: 0xf1e4c3, color2: 0xe3d2a6, variance: 0.1, seed: 41, rough: 0.75, flat: 0.5 }), -0.42, Y + 0.15, 0.05));
  g.add(at(blob({ rx: 0.56, ry: 0.05, rz: 0.46, seg: [36, 12], bump: 0.05, freq: 2, color: 0xc4551a, color2: 0x9b3510, variance: 0.3, seed: 42, rough: 0.28 }), 0.3, Y + 0.02, 0));
  [[0.1, -0.14, 0.6], [0.46, 0.14, -0.4], [0.28, 0.2, 2.2]].forEach(([x, z, ry], i) => {
    const piece = new THREE.Group();
    piece.add(blob({ rx: 0.24, ry: 0.11, rz: 0.14, seg: [28, 18], bump: 0.08, freq: 3, color: 0xb5672c, color2: 0x7f3d17, variance: 0.35, seed: 50 + i, rough: 0.45 }));
    const bone = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.03, 0.13, 10), M(0xeadfc6, 0.5)); bone.geometry.deleteAttribute('uv'); bone.rotation.z = Math.PI / 2; bone.position.set(0.26, 0, 0); piece.add(bone);
    g.add(at(piece, x, Y + 0.12, z, ry));
  });
  const okra = [];
  [[0.05, 0.28, 0.4], [0.5, -0.22, 2.6], [0.62, 0.05, 1.3], [0.16, -0.36, 3.4]].forEach(([x, z, ry]) => okra.push({ geo: new THREE.ConeGeometry(0.036, 0.22, 8), pos: [x, Y + 0.08, z], rot: [0, ry, Math.PI / 2], color: 0x5d8f2e }));
  g.add(mergeColored(okra, vcMat(0.5)));
  herbs(g, rng, 14, 0.3, 0, 0.5, Y + 0.17);
  const chili = new THREE.Mesh(new THREE.CapsuleGeometry(0.018, 0.16, 4, 8), M(0xc4161c, 0.3)); chili.geometry.deleteAttribute('uv'); chili.rotation.set(0, 0.8, Math.PI / 2 - 0.12); chili.position.set(0.0, Y + 0.12, -0.5); g.add(chili);
  return g;
}

function mufete() {
  const g = new THREE.Group(), rng = mulberry32(9);
  g.add(plate({ r: 1.08 }));
  g.add(at(fishBody({ len: 1.0, h: 0.17, w: 0.3, seed: 61, base: 0xc9b690 }), -0.1, Y + 0.14, -0.2, 0.12));

// ---------------------------------------------------------------- cena, luz e câmara
function tableTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const x = c.getContext('2d');
  const gr = x.createRadialGradient(512, 470, 30, 512, 512, 620);
  gr.addColorStop(0, '#2b2a2e'); gr.addColorStop(0.5, '#18181b'); gr.addColorStop(1, '#060607');
  x.fillStyle = gr; x.fillRect(0, 0, 1024, 1024);
  // grão fino, como pedra escura mate
  const rng = mulberry32(5);
  for (let i = 0; i < 26000; i++) { const v = 24 + Math.floor(rng() * 40); x.fillStyle = `rgba(${v},${v},${v + 2},${0.05 + rng() * 0.07})`; x.fillRect(rng() * 1024, rng() * 1024, 1 + rng() * 1.6, 1 + rng() * 1.6); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

let renderer, envTex, tableTex;
function setup(w, h, dpr) {
  if (!renderer) {
    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const pm = new THREE.PMREMGenerator(renderer);
    envTex = pm.fromScene(new RoomEnvironment(), 0.04).texture;
    tableTex = tableTexture();
    document.body.append(renderer.domElement);
  }
  renderer.setPixelRatio(dpr); renderer.setSize(w, h);
}

/** Mesa de pedra escura e luzes (luz principal quente com sombras e uma luz dourada ao fundo). */
function stage(extent = 2.2, shadowSize = 2048) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x09090a);
  scene.environment = envTex; scene.environmentIntensity = 0.5;
  const table = new THREE.Mesh(new THREE.CircleGeometry(14, 64), new THREE.MeshStandardMaterial({ map: tableTex, roughness: 0.72, metalness: 0.0, envMap: envTex, envMapIntensity: 0.12 }));
  table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);
  const key = new THREE.DirectionalLight(0xffefd8, 2.0);
  key.position.set(-2.6, 4.2, 2.4); key.castShadow = true;
  key.shadow.mapSize.set(shadowSize, shadowSize); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
  Object.assign(key.shadow.camera, { left: -extent, right: extent, top: extent, bottom: -extent, near: 0.5, far: 14 });
  scene.add(key);
  const rimLight = new THREE.DirectionalLight(0xd9b865, 1.1); rimLight.position.set(2.6, 2.2, -3.2); scene.add(rimLight);
  return scene;
}
const shadowed = (obj) => { obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return obj; };

function buildScene(def, aspect) {
  const scene = stage();
  const dish = shadowed(def.make());
  scene.add(dish);
  const cam = new THREE.PerspectiveCamera(30, aspect, 0.1, 60);
  const lookY = def.lookY ?? 0.1, high = def.high ?? 1, k = 0.84 * def.zoom;
  cam.position.set(0, 2.65 * high * k + (lookY - 0.1) * 0.5, 3.75 * k); cam.lookAt(0, lookY, 0);
  return { scene, cam, dish };
}

/** Imagem de capa: três pratos e um sumo na mesa, em formato largo (a luz vem da esquerda). */
function buildCover(aspect) {
  const scene = stage(4.6, 4096);
  scene.fog = new THREE.Fog(0x09090a, 8.5, 19); // a mesa desvanece-se no escuro ao fundo
  const put = (id, x, z, ry, s = 1) => { const d = shadowed(DISHES[id].make()); d.position.set(x, 0, z); d.rotation.y = ry; d.scale.setScalar(s); scene.add(d); };
  put('mousse', -1.35, -2.15, 0.2, 0.8);
  put('sumo', 1.55, -2.25, 0, 0.75);
  put('muamba', -2.2, 0.5, 0.35, 0.88);
  put('dourada', 0.05, -0.45, -0.1, 0.92);
  put('pudim', 2.25, 0.55, 0.4, 0.86);
  const cam = new THREE.PerspectiveCamera(30, aspect, 0.1, 80);
  cam.position.set(0, 3.7, 7.2); cam.lookAt(0, 0.35, -0.3);
  return { scene, cam };
}

function disposeScene(scene) {
  scene.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose()); });
}

const api = {
  ids: Object.keys(DISHES),
  titles: Object.fromEntries(Object.entries(DISHES).map(([k, v]) => [k, v.title])),
  /** Desenha um prato e devolve a imagem em PNG (data URL). */
  render(id, w = 1200, h = 900, dpr = 2) {
    setup(w, h, dpr);
    const { scene, cam } = buildScene(DISHES[id], w / h);
    renderer.render(scene, cam);
    const url = renderer.domElement.toDataURL('image/png');
    disposeScene(scene);
    return url;
  },
  cover(w = 1600, h = 900, dpr = 2) {
    setup(w, h, dpr);
    const { scene, cam } = buildCover(w / h);
    renderer.render(scene, cam);
    const url = renderer.domElement.toDataURL('image/png');
    disposeScene(scene);
    return url;
  },
  hasModel: (id) => DISHES[id].glb,
  /** Exporta o prato (sem mesa nem luzes) como GLB em tamanho real (um prato com cerca de 27 cm), em base64. */
  async glb(id) {
    const group = DISHES[id].make();
    group.scale.setScalar(0.13);
    group.traverse((o) => { if (o.isMesh) o.geometry.deleteAttribute('uv'); });
    const root = new THREE.Scene(); root.add(group);
    const buf = await new GLTFExporter().parseAsync(root, { binary: true, onlyVisible: true });
    let s = ''; const u8 = new Uint8Array(buf);
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  },
};
window.dishes = api;

if (new URLSearchParams(location.search).has('sheet')) {
  const sheet = document.createElement('div'); sheet.id = 'sheet'; document.body.prepend(sheet);
  const only = new URLSearchParams(location.search).get('only');
  for (const id of api.ids) {
    if (only && !only.split(',').includes(id)) continue;
    const fig = document.createElement('figure'), img = new Image(); img.src = api.render(id, 600, 450, 1);
    const cap = document.createElement('figcaption'); cap.textContent = api.titles[id];
    fig.append(img, cap); sheet.append(fig);
  }
  renderer.domElement.remove();
}
document.title = 'pronto';
</script>
